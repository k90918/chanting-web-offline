<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#31735a"><link rel="manifest" href="manifest.webmanifest">
<title>離線持經紀錄</title>
<style>
:root{--green:#31735a;--ink:#25322b;--bg:#f6f3eb;--card:#fff;--muted:#64736a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:680px;margin:auto;padding:16px 14px 48px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:4px 0}.header-actions{display:flex;align-items:center;gap:8px}.backup-button,.settings-button{font-size:14px;padding:9px 11px}.card h2 small{font-size:12px;font-weight:700;white-space:nowrap}.card h2 small.normal{color:#2469b2}.card h2 small.urgent{color:#c43a3a}.sub{color:var(--muted);font-size:14px}.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #24302412}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{background:#edf5f0;padding:10px;border-radius:10px;font-size:13px}.item.total-item{background:#dcece2}.item b{display:block;color:var(--green);font-size:19px;margin-top:3px}progress{width:100%;accent-color:var(--green)}input,button{font:inherit}input{width:100%;padding:10px;border:1px solid #cdd8d0;border-radius:10px;margin-top:5px}button{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:white;font-weight:700}button.icon{font-size:20px;padding:8px 12px}.rows label{display:block;margin-top:10px;font-size:14px}.total{font-size:16px;font-weight:bold;color:var(--green);margin:4px 0 8px}.annual-card{padding:12px}.annual-card h2{font-size:16px;margin:0}.annual-grid{grid-template-columns:repeat(3,1fr);gap:6px}.annual-grid .item{padding:7px;font-size:11px}.annual-grid .item b{font-size:15px;margin-top:1px}.annual-list{border:1px solid #d7e0da;border-radius:10px;overflow:hidden;background:#fff}.annual-row{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px;border-bottom:1px solid #e1e8e3;font-size:14px}.annual-row:last-child{border-bottom:0}.annual-row strong{white-space:nowrap;color:var(--green);font-size:17px}.annual-details,.monthly-details{margin-top:10px}.annual-details summary,.monthly-details summary{cursor:pointer;color:var(--green);font-weight:700;padding:10px 2px;list-style-position:inside}.annual-details[open] summary,.monthly-details[open] summary{margin-bottom:8px}.board{border:1px solid #d7e0da;border-radius:12px;overflow:hidden;background:#fff}.board-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:11px 12px 9px;border-bottom:1px dashed #cbd6ce}.board-row:last-child{border-bottom:0}.pin{color:#b35a4b;font-size:11px}.board-name{font-size:15px}.board-count{color:var(--green);font-size:18px}.board-count small{font-size:12px;font-weight:500;color:var(--muted)}.board-progress{grid-column:2/-1;height:6px}dialog{border:0;border-radius:16px;width:min(92vw,460px);box-shadow:0 10px 40px #0004}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.secondary{background:#e2ebe5;color:var(--ink)}
</style></head><body><main class="wrap">
<header><div><h1>離線持經紀錄</h1></div><div class="header-actions"><button class="backup-button" id="backup" aria-label="匯出或匯入備份">備份</button><button class="settings-button" id="settings" aria-label="設定月目標">設定</button></div></header>
<section class="card"><label class="sub">持誦日期<input type="date" id="date"></label><p class="sub" id="lunar"></p></section>
<section class="card annual-card"><h2 id="yearTitle">年度統計</h2><p class="total" id="yearTotal"></p><div id="annual"></div></section>
<section class="card"><h2>本月進度 <small id="monthCountdown"></small></h2><p class="total" id="monthTotal"></p><div id="monthly"></div></section>
<section class="card rows"><h2>本日正確總數</h2><div id="inputs"></div><div class="actions"><button id="save">儲存正確總數</button></div></section>
</main>
<dialog id="goalDialog"><h2>設定各經月目標</h2><div id="goalInputs" class="rows"></div><div class="actions"><button class="secondary" id="cancel">取消</button><button id="saveGoals">儲存目標</button></div></dialog>
<dialog id="backupDialog"><h2>資料備份</h2><p class="sub">匯出可保存目前所有持誦紀錄與月目標；匯入會覆蓋本機現有資料。</p><div class="actions"><button class="secondary" id="cancelBackup">取消</button><button class="secondary" id="importBackup">匯入備份</button><button id="exportBackup">匯出備份</button></div></dialog><input id="backupFile" type="file" accept="application/json,.json" hidden>
<script src="lunar.js"></script><script src="date_utils.js?v=1"></script><script src="backup.js?v=2"></script><script src="annual_view.js?v=1"></script><script src="monthly_view.js?v=2"></script><script src="app.js?v=13"></script></body></html>
